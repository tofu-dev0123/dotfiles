name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: |
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck
      - name: Run luacheck
        run: luacheck nvim/.config/nvim/lua/

  skill-validation:
    name: SKILL.md Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SKILL.md frontmatter
        run: |
          failed=0
          while IFS= read -r file; do
            # フロントマターの開始確認
            if ! head -1 "$file" | grep -q '^---$'; then
              echo "ERROR: フロントマターがありません: $file"
              failed=1
              continue
            fi
            # name フィールドの確認
            if ! awk '/^---$/{f++} f==1' "$file" | grep -q '^name:'; then
              echo "ERROR: name フィールドがありません: $file"
              failed=1
            fi
            # description フィールドの確認
            if ! awk '/^---$/{f++} f==1' "$file" | grep -q '^description:'; then
              echo "ERROR: description フィールドがありません: $file"
              failed=1
            fi
          done < <(find claude/.claude/skills -name 'SKILL.md')
          exit $failed

  nix-fmt:
    name: Nix Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Check formatting with nixfmt
        run: |
          # RFC 166 公式フォーマッタ。--check は差分があれば非ゼロ終了
          nix run nixpkgs#nixfmt -- --check $(find . -name '*.nix' -not -path './.git/*')

  nix-lint:
    name: Nix Lint (statix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run statix
        run: nix run nixpkgs#statix -- check .
